<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEDUSA'S MIXTAPES</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .hero {
      min-height: 86vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      border: 60px solid rgba(200,16,46,0.06);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hero > * { position: relative; z-index: 1; }

    .hero-title {
      font-family: 'Alfa Slab One', serif;
      font-size: clamp(3.2rem, 11vw, 6.5rem);
      line-height: 0.95;
      text-transform: uppercase;
      color: var(--red);
      -webkit-text-stroke: 2px var(--black);
      text-shadow: 5px 5px 0 var(--black);
      margin-bottom: 36px;
      animation: titleDrop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }
    @keyframes titleDrop {
      from { opacity: 0; transform: translateY(-40px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

    .cassette-hero {
      margin: 0 auto 24px;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(4px 6px 0px rgba(26,16,8,0.4));
    }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-18px) rotate(1.5deg); }
    }

    .footer-strip {
      background: var(--tape-brown);
      color: var(--cream);
      text-align: center;
      padding: 20px;
      font-size: 0.88rem;
      font-style: italic;
      border-top: 4px solid var(--red);
    }
    .footer-strip a { color: var(--yellow); text-decoration: none; }
  </style>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="index.html">MEDUSA'S <span>MIXTAPES</span></a>
  <ul class="nav-links">
    <li><a href="library.html">Search</a></li>
    <li><a href="create.html">Create</a></li>
  </ul>
</nav>

<section class="hero">
  <!-- Cassette SVG — no label text -->
  <svg class="cassette-hero" width="300" height="185" viewBox="0 0 300 185" fill="none">
    <rect x="10" y="10" width="284" height="168" rx="18" fill="rgba(0,0,0,0.25)"/>
    <rect x="3" y="3" width="284" height="168" rx="18" fill="#2C1A0E" stroke="#111" stroke-width="3"/>
    <rect x="22" y="13" width="210" height="84" rx="9" fill="#C8102E" stroke="#111" stroke-width="2"/>
    <defs>
      <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="22" y="13" width="210" height="84" rx="9" fill="url(#hatch)" opacity="0.06"/>
    <rect x="22" y="13" width="210" height="22" rx="9" fill="rgba(255,255,255,0.07)"/>
    <!-- Ruled lines only, no text -->
    <rect x="40" y="28" width="140" height="5" rx="3" fill="rgba(255,255,255,0.5)"/>
    <rect x="40" y="42" width="95" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
    <rect x="40" y="54" width="115" height="3" rx="2" fill="rgba(255,255,255,0.25)"/>
    <rect x="40" y="65" width="75" height="3" rx="2" fill="rgba(255,255,255,0.18)"/>
    <!-- Side tabs -->
    <rect x="0" y="60" width="9" height="42" rx="4" fill="#1a0c06" stroke="#111" stroke-width="1"/>
    <rect x="285" y="60" width="9" height="42" rx="4" fill="#1a0c06" stroke="#111" stroke-width="1"/>
    <!-- Window -->
    <rect x="80" y="107" width="100" height="30" rx="7" fill="#0d0d0d" stroke="#333" stroke-width="1.5"/>
    <!-- Left reel -->
    <circle cx="84" cy="122" r="19" fill="#2a2a3a" stroke="#444" stroke-width="1.5"/>
    <circle cx="84" cy="122" r="11" fill="#3D2B1F" stroke="#444" stroke-width="1.5"/>
    <circle cx="84" cy="122" r="6" fill="#B7E26A" stroke="#555" stroke-width="1"/>
    <circle cx="84" cy="122" r="2.5" fill="#111"/>
    <line x1="84" y1="111" x2="84" y2="116" stroke="#666" stroke-width="1.5"/>
    <line x1="76" y1="114" x2="80" y2="118" stroke="#666" stroke-width="1.5"/>
    <line x1="92" y1="114" x2="88" y2="118" stroke="#666" stroke-width="1.5"/>
    <!-- Right reel -->
    <circle cx="174" cy="122" r="19" fill="#2a2a3a" stroke="#444" stroke-width="1.5"/>
    <circle cx="174" cy="122" r="11" fill="#3D2B1F" stroke="#444" stroke-width="1.5"/>
    <circle cx="174" cy="122" r="6" fill="#F5D060" stroke="#555" stroke-width="1"/>
    <circle cx="174" cy="122" r="2.5" fill="#111"/>
    <line x1="174" y1="111" x2="174" y2="116" stroke="#666" stroke-width="1.5"/>
    <line x1="166" y1="114" x2="170" y2="118" stroke="#666" stroke-width="1.5"/>
    <line x1="182" y1="114" x2="178" y2="118" stroke="#666" stroke-width="1.5"/>
    <!-- Tape path -->
    <path d="M103 122 Q129 110 155 122" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
    <!-- Screw holes -->
    <circle cx="15" cy="15" r="4" fill="#111" stroke="#333"/>
    <circle cx="277" cy="15" r="4" fill="#111" stroke="#333"/>
    <circle cx="15" cy="167" r="4" fill="#111" stroke="#333"/>
    <circle cx="277" cy="167" r="4" fill="#111" stroke="#333"/>
  </svg>

  <h1 class="hero-title">MEDUSA'S<br/>MIXTAPES</h1>

  <div class="hero-actions">
    <a href="library.html" class="btn btn-red btn-lg">Build My Tape</a>
  </div>
</section>

</html>
