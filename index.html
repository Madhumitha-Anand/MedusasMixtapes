<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEDUSA'S MIXTAPES</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .hero {
      min-height: 86vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      border: 60px solid rgba(200,16,46,0.06);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hero > * { position: relative; z-index: 1; }

    .hero-title {
      font-family: 'Alfa Slab One', serif;
      font-size: clamp(3.2rem, 11vw, 6.5rem);
      line-height: 0.95;
      text-transform: uppercase;
      color: var(--red);
      -webkit-text-stroke: 2px var(--black);
      text-shadow: 5px 5px 0 var(--black);
      margin-bottom: 36px;
      animation: titleDrop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }
    @keyframes titleDrop {
      from { opacity: 0; transform: translateY(-40px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

    /* Cassette floats AND tilts like the screenshot */
    .cassette-hero {
      margin: 0 auto 28px;
      animation: cassetteFloat 3.5s ease-in-out infinite;
      filter: drop-shadow(6px 8px 4px rgba(26,16,8,0.45));
    }
    @keyframes cassetteFloat {
      0%   { transform: translateY(0px)   rotate(-8deg); }
      50%  { transform: translateY(-20px) rotate(-6deg); }
      100% { transform: translateY(0px)   rotate(-8deg); }
    }

    /* Reel spin animation */
    .reel-l { transform-origin: 112px 162px; animation: reelSpin 2s linear infinite; }
    .reel-r { transform-origin: 248px 162px; animation: reelSpin 2s linear infinite; }
    @keyframes reelSpin { to { transform: rotate(360deg); } }

    .footer-strip {
      background: var(--tape-brown);
      color: var(--cream);
      text-align: center;
      padding: 20px;
      font-size: 0.88rem;
      font-style: italic;
      border-top: 4px solid var(--red);
    }
    .footer-strip a { color: var(--yellow); text-decoration: none; }
  </style>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="index.html">MEDUSA'S <span>MIXTAPES</span></a>
  <ul class="nav-links">
    <li><a href="library.html">Search</a></li>
    <li><a href="create.html">Create</a></li>
  </ul>
</nav>

<section class="hero">

  <!--
    Cassette SVG — styled to match the reference image:
    - Rounded rect body with thick dark border
    - Bright red label with white ruled lines
    - Large dark chunky reels with yellow/green hubs
    - Side notch tabs
    - Tape window cutout
    - Slight tilt + float animation
  -->
  <svg class="cassette-hero" width="360" height="220" viewBox="0 0 360 220" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- Drop shadow layer -->
    <rect x="14" y="14" width="332" height="196" rx="28" fill="rgba(0,0,0,0.28)"/>

    <!-- Main cassette body — very dark brown like screenshot -->
    <rect x="4" y="4" width="332" height="196" rx="28"
      fill="#1E0F07" stroke="#0d0600" stroke-width="4"/>

    <!-- Subtle body highlight at top -->
    <rect x="4" y="4" width="332" height="50" rx="28" fill="rgba(255,255,255,0.04)"/>

    <!-- === RED LABEL AREA === -->
    <rect x="28" y="16" width="304" height="110" rx="16"
      fill="#D91A2A" stroke="#0d0600" stroke-width="2.5"/>

    <!-- Label shine at top -->
    <rect x="28" y="16" width="304" height="32" rx="16" fill="rgba(255,255,255,0.12)"/>

    <!-- White ruled lines on label (like the reference) -->
    <rect x="52" y="56"  width="256" height="8"  rx="4" fill="rgba(255,255,255,0.70)"/>
    <rect x="52" y="74"  width="200" height="6"  rx="3" fill="rgba(255,255,255,0.50)"/>
    <rect x="52" y="90"  width="230" height="5"  rx="3" fill="rgba(255,255,255,0.38)"/>
    <rect x="52" y="104" width="170" height="4"  rx="2" fill="rgba(255,255,255,0.28)"/>

    <!-- === LEFT SIDE TAB (notch) === -->
    <rect x="0" y="86" width="14" height="52" rx="7"
      fill="#110800" stroke="#0d0600" stroke-width="2"/>
    <!-- Tab detail line -->
    <rect x="5" y="96" width="4" height="32" rx="2" fill="rgba(255,255,255,0.08)"/>

    <!-- === RIGHT SIDE TAB === -->
    <rect x="346" y="86" width="14" height="52" rx="7"
      fill="#110800" stroke="#0d0600" stroke-width="2"/>
    <rect x="351" y="96" width="4" height="32" rx="2" fill="rgba(255,255,255,0.08)"/>

    <!-- === TAPE WINDOW CUTOUT === -->
    <rect x="102" y="138" width="156" height="46" rx="12"
      fill="#0a0500" stroke="#1a0a00" stroke-width="2"/>
    <!-- Window inner highlight -->
    <rect x="104" y="140" width="152" height="12" rx="6" fill="rgba(255,255,255,0.03)"/>

    <!-- === LEFT REEL (animated) === -->
    <g class="reel-l">
      <!-- Outer reel ring -->
      <circle cx="112" cy="162" r="32" fill="#1a0d06" stroke="#0d0600" stroke-width="3"/>
      <!-- Middle ring -->
      <circle cx="112" cy="162" r="20" fill="#2a1a0a" stroke="#1a0a00" stroke-width="2"/>
      <!-- Hub — yellow/green like reference -->
      <circle cx="112" cy="162" r="11" fill="#C8B820" stroke="#8a7a00" stroke-width="1.5"/>
      <!-- Center hole -->
      <circle cx="112" cy="162" r="4"  fill="#0d0600"/>
      <!-- Spokes -->
      <line x1="112" y1="145" x2="112" y2="154" stroke="#8a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="101" y1="149" x2="107" y2="156" stroke="#8a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="123" y1="149" x2="117" y2="156" stroke="#8a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="98"  y1="161" x2="107" y2="161" stroke="#8a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="126" y1="161" x2="117" y2="161" stroke="#8a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="101" y1="173" x2="107" y2="166" stroke="#8a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="123" y1="173" x2="117" y2="166" stroke="#8a7a00" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- === RIGHT REEL (animated) === -->
    <g class="reel-r">
      <circle cx="248" cy="162" r="32" fill="#1a0d06" stroke="#0d0600" stroke-width="3"/>
      <circle cx="248" cy="162" r="20" fill="#2a1a0a" stroke="#1a0a00" stroke-width="2"/>
      <!-- Hub — green like reference right reel -->
      <circle cx="248" cy="162" r="11" fill="#6BB820" stroke="#3a7a00" stroke-width="1.5"/>
      <circle cx="248" cy="162" r="4"  fill="#0d0600"/>
      <!-- Spokes -->
      <line x1="248" y1="145" x2="248" y2="154" stroke="#3a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="237" y1="149" x2="243" y2="156" stroke="#3a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="259" y1="149" x2="253" y2="156" stroke="#3a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="234" y1="161" x2="243" y2="161" stroke="#3a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="262" y1="161" x2="253" y2="161" stroke="#3a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="237" y1="173" x2="243" y2="166" stroke="#3a7a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="259" y1="173" x2="253" y2="166" stroke="#3a7a00" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- === TAPE PATH between reels === -->
    <path d="M144 162 Q180 146 216 162"
      stroke="#2a1500" stroke-width="3" fill="none" stroke-dasharray="6 3"/>

    <!-- === CORNER SCREW HOLES === -->
    <circle cx="22"  cy="22"  r="7" fill="#110800" stroke="#0d0600" stroke-width="2"/>
    <circle cx="338" cy="22"  r="7" fill="#110800" stroke="#0d0600" stroke-width="2"/>
    <circle cx="22"  cy="192" r="7" fill="#110800" stroke="#0d0600" stroke-width="2"/>
    <circle cx="338" cy="192" r="7" fill="#110800" stroke="#0d0600" stroke-width="2"/>
    <!-- Screw cross marks -->
    <line x1="19" y1="22" x2="25" y2="22" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="22" y1="19" x2="22" y2="25" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="335" y1="22" x2="341" y2="22" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="338" y1="19" x2="338" y2="25" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="19" y1="192" x2="25" y2="192" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="22" y1="189" x2="22" y2="195" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="335" y1="192" x2="341" y2="192" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="338" y1="189" x2="338" y2="195" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  </svg>

  <h1 class="hero-title">MEDUSA'S<br/>MIXTAPES</h1>

  <div class="hero-actions">
    <a href="library.html" class="btn btn-red btn-lg">Build My Tape</a>
  </div>
</section>

<footer class="footer-strip">
  Made with love by mads &nbsp;|&nbsp;

</footer>

</body>
</html>
